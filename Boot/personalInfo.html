<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
</head>

<body>

    <div class="grid p-5 bg-success ">
        <form class="row g-3">
            <div class="col-md-6">
                <label class="form-label" for="emial">Email</label>
                <input class="form-control" name="email" id="emial" type="email">
            </div>
            <div class="col-md-6">
                <label class="form-label" for="password">password</label>
                <input class="form-control" name="password" id="password" type="password">
            </div>
            <div class="col-md-12">
                <label class="form-label" for="address">Address</label>
                <input class="form-control" name="address" id="address" type="text">
            </div>
            <div class="col-md-12">
                <label class="form-label" for="paddress">Permanent Address</label>
                <input class="form-control" name="paddress" id="paddress" type="text">
            </div>

            <div class="col-md-6">
                <label class="form-label" for="city">City</label>
                <input class="form-control" name="city" id="city" type="text">
            </div>

            <div class="col-md-4">
                <label for="inputState" class="form-label">State</label>
                <select id="inputState" class="form-select">
                    <option selected>Choose...</option>
                    <option>...</option>
                </select>
            </div>

            <div class="col-md-2">
                <label class="form-label" for="city">Zip</label>
                <input class="form-control" name="zip" id="zip" type="number">
            </div>

            
            <div class="mb-3">
                <label for="formFile" class="form-label">Default file input example</label>
                <input class="form-control" type="file" id="formFile">
            </div>
            
            
            <select class="form-select" aria-label="Default Select Sample"  >
                <option >TamilNadu</option>
                <option value="TamilNadu">TamilNadu</option>
                <option  value="Kerala">Kerala</option>
                <option value="Banglore">Banglore</option>
                
            </select>
            
            <div class="col-12">
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="check">
                    <label class="form-label" for="check">Check For Me</label>
                </div>
            </div>

            <div class="col-12">
                <button class="btn btn-primary" type="submit">Sign In</button>
            </div>

        </form>
    </div>

    <div class="alert alert-dark" role="alert">
  A simple dark alert—check it out!
</div>
<div id="liveAlertPlaceholder"></div>
<button type="button" class="btn btn-primary" id="liveAlertBtn">Show live alert</button>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
        crossorigin="anonymous"></script>
</body>

</html>
