<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
</head>

<body>

    <div class="spinner-border text-dark bg-light d-flex justify-content-center align-items-center mt-5">
        <span class="visually-hidden">loading</span>
    </div>
    <div class="spinner-border text-light bg-dark d-flex justify-content-center align-items-center mt-5">
        <span class="visually-hidden">loading</span>
    </div>
    <div class="spinner-border text-success bg-dark d-flex justify-content-center align-items-center mt-5">
        <span class="visually-hidden">loading</span>
    </div>
    <div class="spinner-border text-info bg-black d-flex justify-content-center align-items-center mt-5">
        <span class="visually-hidden">loading</span>
    </div>
    <div class="spinner-border text-warning d-flex justify-content-center align-items-center mt-5">
        <span class="visually-hidden">loading</span>
    </div>
    <div class="spinner-border text-danger d-flex justify-content-center align-items-center mt-5">
        <span class="visually-hidden">loading</span>
    </div>
    <div class="spinner-border text-primary d-flex justify-content-center align-items-center mt-5">
        <span class="visually-hidden">loading</span>
    </div>
    <div class="spinner-border text-secondary d-flex justify-content-center align-items-center mt-5">
        <span class="visually-hidden">loading</span>
    </div>


    <div class="spinner-grow text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
    </div>
    <div class="spinner-grow text-secondary" role="status">
        <span class="visually-hidden">Loading...</span>
    </div>
    <div class="spinner-grow text-success" role="status">
        <span class="visually-hidden">Loading...</span>
    </div>
    <div class="spinner-grow text-danger" role="status">
        <span class="visually-hidden">Loading...</span>
    </div>
    <div class="spinner-grow text-warning" role="status">
        <span class="visually-hidden">Loading...</span>
    </div>
    <div class="spinner-grow text-info" role="status">
        <span class="visually-hidden">Loading...</span>
    </div>
    <div class="spinner-grow text-light" role="status">
        <span class="visually-hidden">Loading...</span>
    </div>
    <div class="spinner-grow text-dark" role="status">
        <span class="visually-hidden">Loading...</span>
    </div>


    <div class="">
        <button class="btn btn-primary" type="button">
            <span class="spinner-border text-light" aria-hidden="true"></span>
            <span class="visually-hidden" role="status"> Loading</span>
        </button>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
        crossorigin="anonymous"></script>
</body>

</html>
