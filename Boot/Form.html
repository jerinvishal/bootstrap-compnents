<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
  </head>
  <body>
    
    <div class="d-grid">
        <div class="row">
            <div class="col">
                <div class="mb-3">
        <label class="form-label" for="email"> Email Address</label>
        <input type="emial" class="form-control" id="emial" placeholder="Enter Your Email id">
    </div>
    <div class="mb-3">
        <label class="form-label" for="TextArea"> Address </label>
        <textarea class="form-control" id="TextArea" rows-3 placeholder="Enter Your Permanent Address" aria-describedby="format"></textarea>
        <div class="format" class="form-text">
            Your Address Must Contain the Floor ,House Name ,Street ,And Area 
        </div>
    </div>
            </div>
        </div>
    </div>


    <div class="row g-3">
        <div class="col">
            <input type="text" class="form-control" placeholder="FirstName" aria-label="FirstName">
        </div>
        <div class="col">
            <input type="text" class="form-control" placeholder="Last Name" aria-label="Last Name">
        </div>
    </div>




    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
  </body>
</html>
